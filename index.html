<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Panel - Krasitska T.</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155; text-align: center; max-width: 450px; }
        .status-dot { height: 12px; width: 12px; background-color: #22c55e; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 10px #22c55e; }
        h1 { color: #38bdf8; margin-bottom: 10px; font-size: 24px; }
        p { color: #94a3b8; line-height: 1.6; }
        .footer { margin-top: 30px; font-size: 0.8em; color: #64748b; border-top: 1px solid #334155; padding-top: 15px; }
        .secure-badge { background: rgba(34, 197, 94, 0.1); color: #4ade80; padding: 5px 15px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="secure-badge">SSL/TLS ENCRYPTED</div>
        <h1>Secure Dashboard</h1>
        <p>Welcome, <strong>Tetiana Krasitska</strong>.</p>
        <p>You have successfully authenticated. This connection is protected by RSA-2048 encryption and Basic Auth.</p>
        
        <div class="footer">
            <span class="status-dot"></span> System Status: Online & Encrypted
        </div>
    </div>
</body>
</html>
